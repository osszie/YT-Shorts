name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The pipeline's heavy runtime deps (whisper/torch, google-generativeai,
      # edge-tts) are imported lazily, so the offline test suite needs only these.
      # Keeps CI fast and avoids pulling torch.
      - name: Install test deps
        run: pip install pytest PyYAML python-dotenv

      - name: Byte-compile (import-safety without media/LLM deps installed)
        run: python -m compileall -q pipeline cli.py

      - name: Run tests
        run: python -m pytest -q
